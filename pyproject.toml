[project]
name = "opshub-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "django~=5.2.17",
    "django-cors-headers>=4.9.0",
    "django-redis>=7.0.0",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.5",
    "python-decouple>=3.8",
]

[dependency-groups]
dev = [
    "django-stubs~=5.2.9",
    "factory-boy>=3.3.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S"]
ignore = ["DJ001"]  # nullable CharField/TextField — fine for optional demo fields

[tool.ruff.lint.per-file-ignores]
"*/tests/**" = ["S101"]  # assert is the whole point in tests
"*/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
